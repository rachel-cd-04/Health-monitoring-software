name: Frontend checks and deployment

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/testing.md"
      - ".github/workflows/frontend-deploy.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/testing.md"
      - ".github/workflows/frontend-deploy.yml"

permissions:
  contents: read

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: frontend-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Deploy isolated frontend to production
        run: |
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN}"
          : "${VERCEL_ORG_ID:?Missing VERCEL_ORG_ID}"
          : "${VERCEL_PROJECT_ID:?Missing VERCEL_FRONTEND_PROJECT_ID}"

          deploy_dir="$(mktemp -d "$RUNNER_TEMP/soma-frontend.XXXXXX")"
          git archive HEAD:frontend | tar -xf - -C "$deploy_dir"
          test -f "$deploy_dir/vercel.json"

          cd "$deploy_dir"
          npx --yes vercel@65.16.0 deploy --prod --yes --token="$VERCEL_TOKEN"
